[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-classification"
version = "0.1.0"
description = "Time-series signal processing with binary serialization and 1D CNN classification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
tsc = "time_series_classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
